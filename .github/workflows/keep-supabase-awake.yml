# Бесплатный проект Supabase засыпает после недели без активности — тогда mp3 на сайте перестают играть.
# Два раза в неделю запрашиваем один маленький кусок mp3 (2 байта), чтобы проект не уснул.
# Запустить вручную: GitHub → Actions → «Supabase: не засыпать» → Run workflow.
# ⚠ Проверить в панели Supabase, что такие запросы считаются активностью (раздел 2 в HANDOFF.md).
name: "Supabase: не засыпать"

on:
  schedule:
    - cron: "17 6 * * 1,4"        # понедельник и четверг, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Запросить mp3 из Supabase Storage
        run: |
          url="https://rmbcltczrruvlepsmtwd.supabase.co/storage/v1/object/public/mp3%20audios/stories/01_weekend_by_the_sea/jenny.mp3"
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Range: bytes=0-1" "$url")
          echo "HTTP $status"
          test "$status" = "206"
